aid: blox
name: Blox
description: 'BLOX is a Bessemer, Alabama design-manufacture-construct (DMC) company
  that describes itself as the largest manufacturer of healthcare buildings in the
  United States. Founded in 2010-2011 as a spinoff of Giattina Aycock Architecture
  Studio by Chris Giattina, BLOX designs, prefabricates and installs modular medical
  buildings and building components — freestanding emergency departments, acute-care
  patient-room modules, primary-care clinics and full hospitals — from a former Pullman
  Standard railcar plant in the Interstate Industrial Park. Customers include HCA Healthcare,
  Encompass Health, Universal Health Services and Walmart Health. The company is privately
  held and its shares appear on secondary-market venues such as Forge Global. BLOX
  publishes no developer program, no public API, and no machine-readable specification;
  its software work is internal tooling for the DMC delivery system rather than a product.'
